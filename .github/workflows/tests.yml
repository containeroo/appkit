name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Resolve module graph
        run: go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
